[tool.poetry]
name = "pacs-lab"
version = "0.1.0"
description = "Practice PACS in Docker, filled with DICOM data, with the settings DICOM Data Explorer needs"
readme = "README.md"
packages = [{ include = "pacs_lab" }]

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
python = ">=3.11,<3.15"
reflex = "0.10.0"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
docker = ">=7.1.0"
requests = "*"
pydicom = "^3.0.2"
pynetdicom = "^3.0.4"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
